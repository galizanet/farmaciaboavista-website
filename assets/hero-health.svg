<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- decorative sparkles -->
  <g opacity=".5" fill="#e5e7eb">
    <circle cx="150" cy="160" r="6"/><circle cx="220" cy="130" r="4"/><circle cx="980" cy="150" r="6"/>
    <circle cx="1040" cy="220" r="4"/><circle cx="180" cy="760" r="5"/><circle cx="1030" cy="760" r="5"/>
  </g>

  <!-- floating pills -->
  <g opacity=".95" filter="url(#shadow)">
    <g transform="translate(170 260) rotate(-18)">
      <rect x="0" y="0" rx="34" ry="34" width="240" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="4"/>
      <path d="M120 6 v78" stroke="#e5e7eb" stroke-width="4"/>
      <rect x="10" y="10" rx="28" ry="28" width="110" height="70" fill="url(#red)" opacity=".95"/>
    </g>

    <g transform="translate(820 310) rotate(14)">
      <rect x="0" y="0" rx="34" ry="34" width="240" height="90" fill="#ffffff" stroke="#e5e7eb" stroke-width="4"/>
      <path d="M120 6 v78" stroke="#e5e7eb" stroke-width="4"/>
      <rect x="120" y="10" rx="28" ry="28" width="110" height="70" fill="url(#red)" opacity=".95"/>
    </g>
  </g>

  <!-- main card -->
  <g transform="translate(290 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="620" height="430" rx="44" fill="#ffffff" stroke="#e5e7eb" stroke-width="4"/>
    <rect x="0" y="0" width="620" height="110" rx="44" fill="#fff1f2" stroke="#e5e7eb" stroke-width="0"/>
    <g transform="translate(60 62)">
      <rect x="-26" y="-26" width="52" height="52" rx="14" fill="url(#red)"/>
      <rect x="-7" y="-20" width="14" height="40" rx="7" fill="#ffffff"/>
      <rect x="-20" y="-7" width="40" height="14" rx="7" fill="#ffffff"/>
    </g>
    <text x="135" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" font-weight="800" fill="#111827">
      Atendimento rápido e humano
    </text>

    <!-- pharmacist / friendly figure -->
    <g transform="translate(110 160)">
      <circle cx="95" cy="70" r="44" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
      <path d="M58 58 q38 -40 74 0" fill="#111827"/>
      <circle cx="78" cy="76" r="6" fill="#111827"/>
      <circle cx="112" cy="76" r="6" fill="#111827"/>
      <path d="M80 96 q18 18 36 0" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>

      <path d="M45 145 q50 -40 100 0 v120 q0 20 -20 20 h-60 q-20 0 -20 -20z" fill="#ffffff" stroke="#e5e7eb" stroke-width="4"/>
      <path d="M95 155 v150" stroke="#e5e7eb" stroke-width="4"/>

      <!-- red cross badge -->
      <g transform="translate(95 198)">
        <rect x="-24" y="-24" width="48" height="48" rx="14" fill="#fff1f2" stroke="#e5e7eb" stroke-width="3"/>
        <rect x="-6" y="-16" width="12" height="32" rx="6" fill="url(#red)"/>
        <rect x="-16" y="-6" width="32" height="12" rx="6" fill="url(#red)"/>
      </g>
    </g>

    <!-- checklist -->
    <g transform="translate(320 180)" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#111827">
      <text x="0" y="0" font-size="22" font-weight="800">Peça pelo WhatsApp</text>
      <g font-size="18" fill="#374151">
        <g transform="translate(0 40)">
          <circle cx="10" cy="0" r="10" fill="#22c55e"/><path d="M5 -1 l4 4 l8 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
          <text x="30" y="6">Envie a receita ou lista de itens</text>
        </g>
        <g transform="translate(0 80)">
          <circle cx="10" cy="0" r="10" fill="#22c55e"/><path d="M5 -1 l4 4 l8 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
          <text x="30" y="6">Confirmamos preço e disponibilidade</text>
        </g>
        <g transform="translate(0 120)">
          <circle cx="10" cy="0" r="10" fill="#22c55e"/><path d="M5 -1 l4 4 l8 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
          <text x="30" y="6">Entrega em toda a cidade de Irecê</text>
        </g>
      </g>
    </g>
  </g>

  <!-- bottom wave -->
  <path d="M0 760 C 200 700, 320 860, 520 820 C 720 780, 920 880, 1200 800 L1200 900 L0 900 Z" fill="#fff1f2"/>
</svg>
